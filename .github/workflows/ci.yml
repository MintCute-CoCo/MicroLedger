name: MicroLedger CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: microledger
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Project Paths
        id: paths
        run: |
          if [ -d "MicroLedger/client" ]; then
            echo "client_dir=MicroLedger/client" >> $GITHUB_OUTPUT
            echo "server_dir=MicroLedger/server" >> $GITHUB_OUTPUT
            echo "has_server=$([ -d "MicroLedger/server" ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          else
            echo "client_dir=client" >> $GITHUB_OUTPUT
            echo "server_dir=server" >> $GITHUB_OUTPUT
            echo "has_server=$([ -d "server" ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            **/package-lock.json

      - name: Install & Build Client
        working-directory: ${{ steps.paths.outputs.client_dir }}
        run: |
          npm ci
          npm run build

      - name: Install Server Dependencies
        if: steps.paths.outputs.has_server == 'true'
        working-directory: ${{ steps.paths.outputs.server_dir }}
        run: npm ci

      - name: Run Database Migrations & Seeds
        if: steps.paths.outputs.has_server == 'true'
        working-directory: ${{ steps.paths.outputs.server_dir }}
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/microledger
          APP_DB_ROLE_PASSWORD: app_secret
          INITIAL_ADMIN_USERNAME: admin
          INITIAL_ADMIN_PASSWORD: adminpassword123
          INITIAL_ADMIN_FULL_NAME: System Admin
          UAT_SEED_CONFIRM: YES
        run: |
          npm run migrate
          npm run db:role
          npm run seed

      - name: Run Server Automated Tests and Performance Benchmark
        if: steps.paths.outputs.has_server == 'true'
        working-directory: ${{ steps.paths.outputs.server_dir }}
        env:
          PORT: 3000
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/microledger
          APP_DATABASE_URL: postgresql://app_user:app_secret@localhost:5432/microledger
          CORS_ORIGIN: http://localhost:5173
          JWT_SECRET: ci-super-secret-jwt-signing-key-at-least-32-characters
          INITIAL_ADMIN_USERNAME: admin
          INITIAL_ADMIN_PASSWORD: adminpassword123
          INITIAL_ADMIN_FULL_NAME: System Admin
          UAT_SEED_CONFIRM: YES
        run: |
          node src/index.js > "$RUNNER_TEMP/microledger-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; wait "$api_pid" 2>/dev/null || true' EXIT

          api_ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/health > /dev/null; then
              api_ready=1
              break
            fi
            sleep 1
          done

          if [ "$api_ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/microledger-api.log"
            echo "API did not become ready within 30 seconds."
            exit 1
          fi

          npm test
          node scripts/load-test.js
